<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Theme CSS -->
    <link href="css/main.css" rel="stylesheet">
    <title>Form Assignment</title>
</head>

<!-- Start: Body -->
<body>
    <main>
        <!-- Form -->
        <div class="form-container">
            <div class="wrapper">
                <div class="form-wrap">
                    <fieldset>
                        <legend>Form Assignment</legend>
                        <div class="form-ip-wrap">
                            <div class="form-input space-bottom-4">
                                <label class="form-label" for="fullname">Full Name</label>
                                <input class="form-ip" type="text" id="fullname" name="fullname-input">
                            </div>
                            <div class="form-input space-bottom-4">
                                <label class="form-label" for="email">Email</label>
                                <input class="form-ip" type="email" id="email" name="email-input">
                            </div>
                        </div>
                        <div class="form-ip-wrap space-bottom-4">
                            <div class="form-input">
                                <label class="form-label" for="message">Message</label>
                                <textarea class="form-ip" id="message" name="message-input" rows="4"></textarea>
                            </div>
                        </div>
                        <div class="form-actions">
                            <input class="form-button" type="submit" value="Submit" name="submit" id="submit-button">
                        </div>
                    </fieldset>
                </div>
            </div>
        </div>
    </main>
    <script src="js/main.js"></script>
</body>
<!-- End: Body -->
</html>
